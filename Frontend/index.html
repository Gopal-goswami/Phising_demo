<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceboook</title>
    <link rel="stylesheet" href="/Frontend/style.css">
</head>

<body>
    <div class="container">
        <div class="left"></div>
        <div class="right">
            <div id="error-message"></div>
            <div id="title">log in to Faceboook</div>
            <div class="input-box">
                <input class="input-field" type="text" placeholder=" " id="email" required>
                <label for="email">Email or Phone Number</label>
            </div>

            <div class="input-box">
                <input class="input-field" type="password" placeholder=" " id="password" required>
                <label for="password">Password</label>
            </div>
            <button class="login-btn" id="login">Log In</button>
            <button class="login-btn" id="forgot-password">Forgotten Password?</button>
            <button class="login-btn" id="create-account">Create New Account</button>
        </div>
    </div>
    <script src="/Frontend/script.js"></script>
</body>

</html>
